apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f account/docker/docker-compose.yml -o account/k8s/
    kompose.image-pull-policy: IfNotPresent
    kompose.init.containers.command: '["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379 && nc -z kafka 9092; do sleep 2; done"]'
    kompose.init.containers.image: busybox:1.36.1
    kompose.init.containers.name: wait-for-dependencies
    kompose.service.healthcheck.readiness.http_get_path: /api/account/docs
    kompose.service.healthcheck.readiness.http_get_port: "9000"
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: account
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: account
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f account/docker/docker-compose.yml -o account/k8s/
        kompose.image-pull-policy: IfNotPresent
        kompose.init.containers.command: '["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379 && nc -z kafka 9092; do sleep 2; done"]'
        kompose.init.containers.image: busybox:1.36.1
        kompose.init.containers.name: wait-for-dependencies
        kompose.service.healthcheck.readiness.http_get_path: /api/account/docs
        kompose.service.healthcheck.readiness.http_get_port: "9000"
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: account
    spec:
      containers:
        - env:
            - name: DB_DATABASE
              value: account-db
            - name: DB_HOST
              value: postgres
            - name: DB_MIGRATIONS_RUN
              value: "true"
            - name: DB_PASSWORD
              value: password
            - name: DB_PORT
              value: "5432"
            - name: DB_TYPE
              value: postgres
            - name: DB_USERNAME
              value: postgres
            - name: HTTP_PORT
              value: "9000"
            - name: KAFKA_CLIENT_BROKERS
              value: kafka:9092
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          image: oni-lab4-account:lab4
          imagePullPolicy: IfNotPresent
          name: account
          ports:
            - containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/account/docs
              port: 9000
      initContainers:
        - command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z redis 6379 && nc -z kafka 9092; do sleep 2; done
          image: busybox:1.36.1
          name: wait-for-dependencies
      restartPolicy: Always
