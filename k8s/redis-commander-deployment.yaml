apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f account/docker/docker-compose.yml -o account/k8s/
    kompose.image-pull-policy: IfNotPresent
    kompose.service.healthcheck.readiness.http_get_path: /
    kompose.service.healthcheck.readiness.http_get_port: "8081"
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: redis-commander
  name: redis-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis-commander
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f account/docker/docker-compose.yml -o account/k8s/
        kompose.image-pull-policy: IfNotPresent
        kompose.service.healthcheck.readiness.http_get_path: /
        kompose.service.healthcheck.readiness.http_get_port: "8081"
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: redis-commander
    spec:
      containers:
        - env:
            - name: REDIS_HOSTS
              value: local:redis:6379
          image: ghcr.io/joeferner/redis-commander:latest
          imagePullPolicy: IfNotPresent
          name: account-cache-commander
          ports:
            - containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8081
      restartPolicy: Always
