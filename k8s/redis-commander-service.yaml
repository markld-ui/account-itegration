apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f account/docker/docker-compose.yml -o account/k8s/
    kompose.image-pull-policy: IfNotPresent
    kompose.service.healthcheck.readiness.http_get_path: /
    kompose.service.healthcheck.readiness.http_get_port: "8081"
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: redis-commander
  name: redis-commander
spec:
  ports:
    - name: "29094"
      port: 29094
      targetPort: 8081
  selector:
    io.kompose.service: redis-commander
