services:
  postgres:
    image: postgres:16-alpine
    container_name: account-db-postgres
    ports:
      - '5132:5432'
    expose:
      - '5432'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.tcp_port: '5432'
      kompose.volume.size: 1Gi
      kompose.volume.type: persistentVolumeClaim
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: account-db
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'account-db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: account-cache-redis
    ports:
      - '6379:6379'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.tcp_port: '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: account-cache-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '29094:8081'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.http_get_path: /
      kompose.service.healthcheck.readiness.http_get_port: '8081'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  transaction-postgres:
    image: postgres:16-alpine
    container_name: transaction-db-postgres
    ports:
      - '5133:5432'
    expose:
      - '5432'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.tcp_port: '5432'
      kompose.volume.size: 1Gi
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transaction-db
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'transaction-db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: oni-kafka
    ports:
      - '29092:29092'
    expose:
      - '9092'
      - '9093'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.tcp_port: '9092'
      kompose.volume.size: 1Gi
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-topics.sh',
          '--bootstrap-server',
          'localhost:9092',
          '--list',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: oni-kafka-ui
    ports:
      - '18080:8080'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.http_get_path: /
      kompose.service.healthcheck.readiness.http_get_port: '8080'
    environment:
      DYNAMIC_CONFIG_ENABLED: 'false'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  account:
    image: oni-lab4-account:lab4
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '9000:9000'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.http_get_path: /api/account/docs
      kompose.service.healthcheck.readiness.http_get_port: '9000'
      kompose.init.containers.name: wait-for-dependencies
      kompose.init.containers.image: busybox:1.36.1
      kompose.init.containers.command: '["sh", "-c", "until nc -z postgres 5432 && nc -z redis 6379 && nc -z kafka 9092; do sleep 2; done"]'
    environment:
      HTTP_PORT: 9000
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: account-db
      DB_MIGRATIONS_RUN: 'true'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_CLIENT_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  auth:
    image: oni-lab4-auth:lab4
    build:
      context: ../../auth
      dockerfile: Dockerfile
    ports:
      - '9001:9001'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.http_get_path: /api/auth/docs
      kompose.service.healthcheck.readiness.http_get_port: '9001'
      kompose.init.containers.name: wait-for-dependencies
      kompose.init.containers.image: busybox:1.36.1
      kompose.init.containers.command: '["sh", "-c", "until nc -z redis 6379 && nc -z account 9000; do sleep 2; done"]'
    environment:
      HTTP_PORT: 9001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ACCOUNT_URL: http://account:9000/api/account
    depends_on:
      redis:
        condition: service_healthy
      account:
        condition: service_started
    restart: unless-stopped

  transaction:
    image: oni-lab4-transaction:lab4
    build:
      context: ../../transaction
      dockerfile: Dockerfile
    ports:
      - '9002:9002'
    labels:
      kompose.image-pull-policy: IfNotPresent
      kompose.service.healthcheck.readiness.http_get_path: /api/transaction/docs
      kompose.service.healthcheck.readiness.http_get_port: '9002'
      kompose.init.containers.name: wait-for-dependencies
      kompose.init.containers.image: busybox:1.36.1
      kompose.init.containers.command: '["sh", "-c", "until nc -z transaction-postgres 5432 && nc -z kafka 9092; do sleep 2; done"]'
    environment:
      HTTP_PORT: 9002
      DB_TYPE: postgres
      DB_HOST: transaction-postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: transaction-db
      DB_MIGRATIONS_RUN: 'true'
      KAFKA_CLIENT_BROKERS: kafka:9092
    depends_on:
      transaction-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  transaction-postgres-data:
  kafka-data:
