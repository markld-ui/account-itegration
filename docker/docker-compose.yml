services:
  postgres:
    image: postgres:16-alpine
    container_name: account-db-postgres
    ports:
      - '5132:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: account-db
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: account-cache-redis
    ports:
      - '6379:6379'
    restart: unless-stopped
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: account-cache-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '29094:8081'
    depends_on:
      - redis
    restart: unless-stopped
  transaction-postgres:
    image: postgres:16-alpine
    container_name: transaction-db-postgres
    ports:
      - '5133:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: transaction-db
    volumes:
      - transaction-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d transaction-db']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    container_name: oni-kafka
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data/logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  transaction-postgres-data:
  kafka-data:
